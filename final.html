<section class="beat"><p class="reveal">I don't want an answer.</p></section>
<section class="beat"><p class="reveal">Not tonight, Neither in next 50-60 yaers</p><p class="soft reveal" style="--d:1.4s;margin-top:2rem"><br>Not because I love you.</p></section>
<section class="beat"><p class="long reveal">I just wanted you to know what you mean to me.</p></section>
<section class="beat"><p class="reveal">Whatever happens next...</p><p class="reveal" style="--d:1.8s;margin-top:2.5rem">Thank you for being you.</p></section>
<section class="beat"><p class="soft reveal">After everything, I'm still grateful that we found our way back to each other.</p><p class="sig reveal" style="--d:1.2s">— Kaddu</p></section>
